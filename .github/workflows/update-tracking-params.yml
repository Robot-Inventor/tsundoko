name: Update tracking parameter rules

on:
    schedule:
        - cron: "0 3 * * 1"
    workflow_dispatch:

jobs:
    update:
        runs-on: ubuntu-latest

        permissions:
            contents: write
            pull-requests: write

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

            - run: bun run update:tracking-params

            - name: Open an update pull request
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if git diff --quiet; then
                      exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  branch="chore/update-tracking-params"
                  git checkout -B "$branch"
                  git add src/lib/trackingParamRules.ts
                  git commit -m "chore: update tracking parameter rules"
                  git push --force origin "$branch"

                  title="chore: update tracking parameter rules"
                  body="Weekly refresh of the tracking parameter rules from DandelionSprout/adfilt."
                  pr_number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
                  if [ -n "$pr_number" ]; then
                      gh pr edit "$pr_number" --title "$title" --body "$body"
                  else
                      gh pr create --base main --head "$branch" --title "$title" --body "$body"
                  fi
